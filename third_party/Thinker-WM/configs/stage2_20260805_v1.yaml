# stage2_20260805_v1：agibot_beta + robotwin×4 全模态联合训练（dev/20260805
# 评审修复版代码，从 stage2_20260803_v2 的 checkpoint_step_6000 仅权重热启动）
# 与 stage2_20260803_v2 的唯一配置差异：finetune 起点由 stage1 video-only ckpt
# （step_18000）改为 0803_v2 自己训出的 checkpoint_step_6000
# （见 finetune.checkpoint_path）；数据/模型/调度/超参完全继承。
#
# 本配置需搭配 dev/20260805 分支代码运行，相对 0803 的代码侧修复（不影响配置键）：
#   1) 评审 #1：und token 的 VLM padding 位不再作为 K/V 进入注意力
#      （video/action encode/decode context_lens、uni self/cross-attn 共 5 处）。
#   2) 评审 #2：action token RoPE 整体错位 1 格修复（grid 在 prepend state 之后
#      构建）——改变计算语义，旧 ckpt 权重形状兼容、带 1 位 RoPE 偏移属预期代价。
#   3) 评审 #3：Wan 主干加载失败不再静默回退随机初始化（finetune 路径写错会在
#      启动时直接 raise）；提交前先在集群确认 step_6000 路径存在。
#   4) 评审 #10：T5 从模型移除；旧 ckpt 的 world_model.t5_emb.* 键由
#      UBT_WM.load_state_dict 重写自动过滤，strict 加载不受影响（finetune 仅加载
#      权重，optimizer/scheduler 全新并重新 warmup，不涉及 ZeRO optimizer state）。
#   5) 评审 #12/#13：nonfinite 全量扫描降频 50 步（下方 diagnostics）、弹性续训
#      不重置 scheduler。
#   6) 统一 VLM task prompt 由 Scene/Task 两句式扩为 Scene/Task/Action/Outcome
#      四字段（unified_vlm_task_prompt: true 不变，代码侧生效）。
#
# 模型侧四项修复（继承自 0803_v1/v2，与 Wan2.2 TI2V 官方语义对齐）：
#   1) 首帧条件一致性（P0）：训练时首帧 latent 不加噪，首帧全部 h×w 个 token
#      的时间标签置 0；uni 分支中 und token（干净 VLM 条件）时间标签同样置 0。
#   2) 推理调度一致性（P1）：inference 的 σ 网格用与训练相同的 shift 变换
#      （model.wm.flow_shift，默认 5.0）；评估步数 20 → 50。
#   3) uni cross-attn 去掉 RoPE（P2）：与 Wan 原版一致。
#   4) action RoPE 时间轴对齐（P3）：uni self-attn 中 action token 的 RoPE
#      时间频率按 action_t_downsample/(video_action_freq_ratio×4) 缩放。
#
# 数据侧与 stage2_20260731_v1/0802_v1/0803_v1/0803_v2 的源/配比/裁剪/projector/
# prompt 完全一致（agibot_beta + robotwin×4、4:1、主视图、5 层 MLP、
# video_action_freq_ratio: 1）。ranges 不再复用 0731，改为 stage2_20260805_v1
# 窗口过滤版（build 期过滤，仅改 ranges 文件、不动运行时处理）：
#   --window-static-eps 0.01 --window-max-static-frames 12：静止帧 = 帧内动作步
#     逐维最大变化 < 0.01（归一化单位）；两道规则叠加——1) 连续静止 >= 12 视频帧的
#     区段从窗口起点域剔除（孤立静止帧保留）；2) 窗口末帧 s+N 位于长度 >= 12 帧的
#     静止 run 内（即窗口末尾连续静止 >= 12 帧）的窗口起点剔除（中段静止不受影响）；
#   --window-outlier-threshold 50：窗口内任一 action/state 幅值 > 50 剔除该窗口起点。
# 构建命令（train/holdout 各 5 源，catalog 与 split seed 20260713 同 0731）：
#   CAT=/data/jiyuan.wang/EpisodeCatalogs
#   OUT=/data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1
#   python data_prepare/build_sampling_ranges.py \
#     --catalog $CAT/_20260723/agibot_beta/agibot_beta_full_20260723_concise_v2.episode_catalog.jsonl \
#     --dataset agibot_beta --num-video-frames 48 \
#     --window-static-eps 0.01 --window-max-static-frames 12 --window-outlier-threshold 50 \
#     --split train --holdout-fraction 0.01 --output $OUT/agibot_beta.train.ranges.sqlite
#   （--split holdout 同样再建 agibot_beta.holdout.ranges.sqlite；robotwin×4 类似，
#   catalog 取 $CAT/_20260727/ten_source_full_v1/<n>.20260727_full_v1.episode_catalog.jsonl）
#   注意：构建环境需 OMP_NUM_THREADS=1（多核节点上 torch 默认线程池会让每 episode
#   的微小张量操作慢数百倍；build_sampling_ranges 已内置 torch.set_num_threads(1)，
#   但 OMP/MKL 环境变量仍建议显式设置）。
common:
  action_dim: 26
  state_dim: 26
  num_video_frames: 48
  video_height: 480
  video_width: 640
  global_downsample_rate: 1
  video_action_freq_ratio: 1
dataset:
  type: indexed_mix
  batches_per_epoch: null
  robot_names:
    aloha-agilex:
      action_dim: 14
      aliases:
      - aloha-agilex
      - aloha
      - agilex
    ARX-X5:
      action_dim: 14
      aliases:
      - arx-x5
      - arx
      - x5
    piper:
      action_dim: 14
      aliases:
      - piper
    ur5-wsg:
      action_dim: 14
      aliases:
      - ur5-wsg
      - ur5
      - wsg
    agibot-a2-d:
      action_dim: 26
      aliases:
      - agibot-a2-d
      - agibot
      - agibot_beta
  # indexed（Catalog/SamplePool）数据源。catalog 由 motus_data releases.yaml 默认
  # 解析（/data/jiyuan.wang/EpisodeCatalogs 下已冻结的 20260723/20260727
  # release 全量版）。每源 pool spec 为 sampling_ranges：运行时内存动态生成
  # 随机窗口（不落盘 pool 文件），默认 consecutive 布局（视频连续 49 帧 +
  # 1 state + 48 动作帧）。ranges 为 stage2_20260805_v1 窗口过滤版
  # （静止区段 + 离群窗口剔除，构建命令见头注）。
  sources:
  - name: agibot_beta
    dataset: agibot_beta
    weight: 1.0
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/agibot_beta.train.ranges.sqlite
    eval_pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/agibot_beta.holdout.ranges.sqlite
  - name: robotwin_aloha
    dataset: robotwin_aloha
    weight: 0.0625
    reader:
      type: robotwin_main_view
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_aloha.train.ranges.sqlite
    eval_pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_aloha.holdout.ranges.sqlite
  - name: robotwin_ur5
    dataset: robotwin_ur5
    weight: 0.0625
    reader:
      type: robotwin_main_view
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_ur5.train.ranges.sqlite
    eval_pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_ur5.holdout.ranges.sqlite
  - name: robotwin_arx
    dataset: robotwin_arx
    weight: 0.0625
    reader:
      type: robotwin_main_view
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_arx.train.ranges.sqlite
    eval_pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_arx.holdout.ranges.sqlite
  - name: robotwin_piper
    dataset: robotwin_piper
    weight: 0.0625
    reader:
      type: robotwin_main_view
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_piper.train.ranges.sqlite
    eval_pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260805_v1/robotwin_piper.holdout.ranges.sqlite
model:
  wan:
    checkpoint_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B
    config_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B
    vae_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    precision: bfloat16
  vlm:
    checkpoint_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Qwen3-VL-2B-Instruct
    config_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Qwen3-VL-2B-Instruct
    precision: bfloat16
    frozen: true
  wm:
    video_encoder_layer_num: 8
    video_decoder_layer_num: 8
    action_encoder_layer_num: 8
    action_decoder_layer_num: 8
    und_layer_num: 4
    action_t_downsample: 1
    action_projector_mlp_layers: 5
    # flow matching σ 调度 shift（训练时间标签与推理 σ 网格共用，Wan2.2
    # TI2V 官方为 5.0）；改动必须训练/推理保持一致，勿两侧分别调。
    flow_shift: 5.0
  # 统一 VLM task prompt：train/sample/eval 用 t5 原始任务文本经
  # utils.vlm_utils.build_vlm_task_message 重建 vlm 消息（Scene/Task/Action/Outcome 四字段）。
  unified_vlm_task_prompt: true
  inference:
    num_inference_timesteps: 50    # 与 shift 调度配套（官方 50 步）；此前 20 步偏低
    guidance_scale: 5.0    # CFG 引导强度（评审 #6；Wan2.2 TI2V 官方 guide_scale=5.0），配合 condition_dropout_prob 训练出的无条件分支；1.0 = 关闭
  timing_level: 2    # 模型内部耗时检查点级别: 1=分支级, 2=+逐block(每block两次CUDA同步; 5B模型每步约60次同步, 占比可忽略; 不需要时改回1)
  condition_dropout_prob: 0.1    # 文本条件 dropout（评审 #6）：10% 样本的 VLM 文本替换为空文本，训练无条件分支，使 CFG 可用；推理侧用 model.inference.guidance_scale>1 启用
  freeze_action_branch: false
  gradient_checkpointing: true
  checkpoint_video_branch: true
  checkpoint_uni_branch: true
  checkpoint_action_branch: true
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
training:
  batch_size: 16
  max_steps: 300000
  learning_rate: 1.25e-05
  weight_decay: 0.01
  scheduler_type: linear
  warmup_steps: 0
  cycle_length: 1000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  num_workers: 0
  prefetch_factor: null
  persistent_workers: false
  pin_memory: false
  # 每个 batch VAE encode 一次后、按不同噪声独立参数更新的步数（默认 1=不复用）。
  # 取数/VAE encode 摊薄到 N 个 optimizer step；global_step/LR 调度仍按 step 计，
  # 数据消耗相应慢 N 倍（同一 batch 被连续更新 N 次，噪声/timestep 每步重采样）。
  train_steps_per_vae_encode: 10
system:
  checkpoint_dir: ./checkpoints
  log_level: INFO
  log_interval: 10
  save_interval: 1000000000
  val_interval: 204800000000
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
  ready_batch_queue_enabled: true
  ready_batch_queue_size: 6
  ready_batch_queue_timeout_seconds: 600
  ready_batch_queue_low_watermark: 0
  ready_batch_queue_clone_tensors: true
  train_loop_gc_interval: 100
diagnostics:
  action_diagnostics_enabled: true
  action_diagnostics_interval: 50
  action_loss_anomaly_threshold: 10.0
  action_tensor_abs_anomaly_threshold: 50.0
  grad_norm_anomaly_threshold: 1000.0
  heartbeat_enabled: false
  heartbeat_memory_interval: 10
  # 非有限全量扫描（参数/梯度逐 tensor isfinite + 跨 rank allreduce）降频到
  # 每 50 步（评审 #12）：1=每步（旧行为，5B 模型每步上千次 CUDA 同步）；
  # 间隔步不拦截非有限梯度（loss 标量检查仍每步执行）；MOTUS_NONFINITE_FAIL_FAST=0
  # 时扫描整体关闭。
  nonfinite_scan_interval: 50
logging:
  report_to: tensorboard
  wandb_project: motus
  tensorboard_log_dir: tensorboard_logs_new
  run_name: stage2_20260805_v1_agibot_beta_robotwin4src_mainview_mlp5_cleancond_ft_0803v2_4k_bs16_300k
resume:
  # finetune 热启动（仅加载权重），不做完整续训
  checkpoint_path: null
  auto_resume_latest: false
  # 弹性续训不重置 scheduler（评审 #13）：auto-resume 接着原 LR 计划走、不重新
  # warmup；首次 finetune 热启动走下方 finetune.checkpoint_path 仅权重路径，本键不生效。
  reset_scheduler: false
finetune:
  # 0805_v1 唯一配置差异：从 stage2_20260803_v2 训出的 checkpoint_step_6000
  # 仅加载权重热启动（FINETUNE_CHECKPOINT 环境变量会覆盖本值，见
  # k8s_job_script/stage2_20260805_v1.sh）
  checkpoint_path: /data/chen.liao/thinkerwm-pretrain/thinkerwm-pretrain/checkpoints/stage2_20260803_v2/ogi-pre-train-stage2-20260803-v2/checkpoint_step_6000
monitor:
  # 训练监控（monitor/ 库）：写 append-only 分块 JSONL 到
  # <仓库上级目录>/motus_monitor_data/，本机 web 服务经 SSH 增量同步。
  # 关闭：enabled: false 或环境变量 MOTUS_MONITOR_ENABLED=0。
  enabled: true
  metrics_interval: 1  # monitor 指标记录间隔（步）：1=每步都记；与 console/TB 的 log_interval 无关
  data_dir: null          # null = 默认目录（可用 $MOTUS_MONITOR_DIR 覆盖）
  system_interval: 2.0    # 每节点系统采样间隔（秒，local_rank0 采样）
  status_interval: 2.0    # status.json 最小重写间隔（秒）
  collect_system: true
periodic_eval:
  # 周期性定集评测（periodic_eval/ 包）：每 interval_steps 步、每个 rank 各评
  # 一个固定 batch（batch size = training.batch_size），每轮内容/数据集配比
  # 固定。素材在训练启动时由 CPU-only 后台子进程预解码到 cache_dir
  # （manifest + sha256，跨训练任务复用），训练前台零解码。产物写 monitor
  # run_dir 的 eval/（索引流 + compare.mp4/actions.png/meta.json），
  # Web UI「eval 评估」tab 展示。全流程失败自吞，不影响训练。
  enabled: true
  interval_steps: 1000
  num_inference_steps: null     # null = model.inference.num_inference_timesteps（50）
  seed: 20260805                # 评测窗口/生成噪声种子（固定 → 每轮内容一致）
  vlm_generate: true            # 旁路 greedy 生成 VLM 文本（Scene/Task/Action/Outcome）
  vlm_max_new_tokens: 128
  fps: 6
  keep_rounds: 20               # 集群侧只保留最近 20 轮媒体（本机已同步副本不受影响）
  save_separate_videos: false   # 默认只存 compare 三联屏；true 另存 gt/pred.mp4
  cache_dir: /data/chen.liao/thinkerwm-pretrain/periodic_eval_cache
  # 各评测源权重（决定各 rank batch 来源配比，largest-remainder 确定性分配）：
  # 缺省 = 训练权重（agibot_beta 1.0 / robotwin×4 0.0625）+ ewmbenchmark 0.25；
  # 在此显式列出可覆盖，权重 <= 0 排除该源。
  source_weights:
    ewmbenchmark: 0.25
  ewmbenchmark:
    enabled: true
    root: /data/chen.liao/EWMBenchmark
    robot_name: agibot-a2-d     # EWM 无 action/state 语义，借用已注册机器人名
