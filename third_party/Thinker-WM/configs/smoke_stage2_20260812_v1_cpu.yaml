    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260807/robotwin_arx.train.ranges.sqlite
  - name: robotwin_piper
    dataset: robotwin_piper
    weight: 0.005
    reader:
      type: robotwin_main_view
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260807/robotwin_piper.train.ranges.sqlite
training:
  batch_size: 2
system:
  num_workers: 0
  pin_memory: false
  ready_batch_queue_enabled: true
  ready_batch_queue_size: 2
  ready_batch_queue_timeout_seconds: 600
  ready_batch_queue_clone_tensors: false
