    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260812_v1_smoke/libero_goal.ranges.sqlite
  - name: libero_object
    dataset: libero_object
    weight: 0.005
    output_adapter: motus_native_multimodal_batch_v1
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260812_v1_smoke/libero_object.ranges.sqlite
  - name: libero_spatial
    dataset: libero_spatial
    weight: 0.005
    output_adapter: motus_native_multimodal_batch_v1
    pool:
      type: sampling_ranges
      path: /data/chen.liao/thinkerwm-pretrain/training_dataset_config/sampling_ranges/stage2_20260812_v1_smoke/libero_spatial.ranges.sqlite
  - name: openvid
    dataset: openvid
    weight: 0.2
    prompt_mode: text_only
    adapter_options:
      state_action_policy: absent
      allow_missing_state_action: true
