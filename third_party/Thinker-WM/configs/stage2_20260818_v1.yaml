# stage2_20260818_v1：MotusBrain 噪声分布对齐轮（分支 dev/20260818，自 tag
# dev/20260815-alpha.20260818 拉出）——在 stage2_20260815_v1 基础上：
#   1) video/action 训练与推理的噪声分布与 MotusBrain 保持一致：per-modality
#      SNR-based timestep sampling（timeshift video=6/action=1，即
#      flow_shift: 6.0 / action_flow_shift: 1.0，训练 σ 采样与推理 σ 网格
#      共用同一 shift）+ 纯 MSE 无加权 loss；action 噪声逐帧 i.i.d.，推理
#      初始噪声同分布。
#   2) 20260818 数据源变更：openvid 加回（纯视频源，权重 0.10，全部自
#      egoverse×6 划出——×6 各 0.0203509→0.0036842、合计 0.1221054→
#      0.0221054，egoscale 0.20 与 agibot/libero 不变，权重和=1，源数
#      14→15）——撤销 0815 轮"先忽略去除"（存档头注 5）。ranges 新建于
#      sampling_ranges/stage2_20260818_v1/（构建脚本
#      scripts/build_openvid_ranges_20260818_v1.sh）：固定 5fps 轮语义
#      --video-stride --action-fps-ratio 6（放弃 0812_v2 的 ratio 1 变
#      FPS 拍板，30fps 原生经 ratio 6 精确得 5fps）+ 新建库期最小时长
#      过滤 --min-episode-frames 289（= 48×6+1，有效长度不足一个完整
#      无填充窗口的 episode 整条剔除，约存活 16.1%、~16.5 万条，不再
#      保留 s=0 单起点末帧填充退化窗口）；--max-stride 10 同
#      egoverse/egoscale 为格式残留（本配置不写 stride_max → k=1）。
#      train 池 windows_per_episode: 16（libero 同待遇：289~303 帧
#      episode 有效起点 <16，同 episode 组批 drop_last 下会被整体丢弃；
#      每 episode 均等采样位亦避免超长视频主导 10% 份额）。源条目沿用
#      0812_v2 写法：prompt_mode text_only + adapter 四件套（absent/
#      allow_missing/placeholder 26/action_loss_weight 0）；robot_names
#      的 openvid-null 条目恢复引用。
#   3) 跨 rank 数据源分配启用 weighted_per_step（20260818 追加；本注为原地
#      修订）：dataset.cross_rank_source_policy——同一 data step 的全部
#      rank 槽位按源权重分配，不同 rank 取不同源（小权重源经跨 step 小数
#      配额补偿按正确长期频率出现；确定性调度、无 collective），缺省
#      synchronized（全 rank 同源）为历史行为。库实现见 motus-data-factory
#      dev/20260818-datafactory-updates（docs/CROSS_RANK_SOURCE_SAMPLING_ZH.md），
#      本仓库 data_prepare/factory.py 同轮补转发接入。
#   4) 20260819 数据源文本变更（本注为原地修订）：除 openvid 外全部数据
#      集统一为「窗口区间内所有文本拼接进 prompt + 统一 VLM 输出格式
#      （Scene/Task/Action/Outcome 四字段模板 + 首帧图，同 agibot-beta
#      既有待遇）」。具体：①ranges 新 payload kind "segmented"——
#      agibot/agibot_beta/egoverse/egoscale 四族按窗口 [start, start+span]
#      正重叠选「episode 级 context + 全部重叠片段」（原 agibot 只取覆盖
#      起点的单一片段，egoverse/egoscale 原固定首条文本；起点域改片段
#      覆盖并集，不被任何片段覆盖的起点剔除；零片段但有 task 级文本的
#      episode——egoverse aria×3/eva 全 catalog 无 annotation 标注、仅
#      task_description_en——按 20260819 用户拍板回退 fixed：起点域不
#      裁剪、prompt = 统一四字段格式要求 + task 文本；片段与 context
#      都没有的 episode 才整条剔除），
#      见 data_prepare/sampling_ranges.py；②egoverse×6、egoscale×2 删除
#      prompt_mode text_only，回退缺省 vlm_image_text（openvid 保持
