#   5) 20260819 VLM 文本改写（本注为原地追加，用户拍板；v2 同日再修订）：
#      分段文本（注 4）后 vlm 消息 = 四字段模板 + episode context + 窗口
#      全部重叠片段，und token 实测 ~1200 超 uni 分支 rope freqs 1024 行
#      上限，训练首步即崩（shape '[1195, 1, 1, -1]' is invalid for input
#      of size 22528，wan/modules/model.py rope_apply）。修复不走扩表/
#      截断，改为 model.vlm_text_rewrite: true——UndBranch.encode 前先用
#      批量 greedy generate（vlm_rewrite_max_new_tokens=128 硬上限）让
#      VLM 把长消息主动压缩改写成短文本，再走纯文本编码，und token
#      保证 <1024；text_only 源（openvid）不改写，生成异常整批回退原始
#      消息编码（models/und_branch.py）。
#      v2（20260819 晚些，用户三点拍板，结合 /save/eval_sample 视频人工
#      核对 v1 改写质量后）：①改写不再输入首帧图（纯文本 generate，
#      消息也不带图）；②输出字段从 Scene/Task/Action/Outcome 四字段改为
