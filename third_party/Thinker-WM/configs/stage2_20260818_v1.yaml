# 热启动注意：旧 ckpt（0807 系/0812_v2）经 load_state_dict 自动 remap
# 加载——64→80 growth → 80→20 列切片（_remap_unified_eef20）→
# t_downsample 1→6（均值池化/平铺初始化），fps_conditioner.* 与
# state_embedding/state_unembedding 键按 legacy 前缀丢弃（均为 ubt_wm.py
