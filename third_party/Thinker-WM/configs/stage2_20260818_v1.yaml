#      （逐字段 ≤25 词、只保留任务/运动/场景、禁止预测未来结果）——v1
#      实测 Outcome 普遍存在"默认任务成功"幻觉；同日追加：通用防编造
#      强化为"NEVER fabricate：只允许输入显式陈述的信息，未陈述的细节
#      一律省略"，且 Action 格式行松绑为"描述运动和目标物体"、不再强制
#      命名手臂——稀疏输入（raw_text 仅一行 Task，如 egoverse aria/eva、
#      libero）下"naming the arm(s)"会迫使 2B 模型编造臂别/场景，实测
#      强化软规则无效、松绑模板压力才治本（libero_object 同样本两次生成
#      left/right 横跳为瞎猜实锤）；egoscale 模板保留命名手部（其输入
#      Action 行本就含 Left/Right hand 分工，grounded）；③按数据集家族分模板
#      （build_vlm_rewrite_message(source_key)）：egoscale 输入先整行剥离
#      Task label/Action label/Hand/Camera motion 标注元数据（用户拍板这些
#      字段无用、不进输入；v1 实测 egoscale 退化：三字段后整段粘贴元数据
#      并在 128 token 上限截断、Outcome 缺失），模板只对保留的 Task name/
#      Task/Action/Scene semantic 内容行下指令。新增输出校验
#      validate_vlm_rewrite：缺 Task/Action 行或复读元数据行的样本替换
#      为安全占位文本（MOTUS_VLM_REWRITE_FALLBACK，不回退长原文避免再
#      触发 rope 上限）；condition dropout 的空文本消息不参与生成、原样
#      透传。开启时 vlm_field_dropout_prob 不适用（编码文本是生成结果，
#      指令侧 dropout 不影响内容）。代价：改写纯文本化后比 v1 更便宜；
#      wm_und_vlm_rewrite_seconds 计时断面可查。
#   6) 历史变更（固定 5fps、20 维 delta-EEF、state token 移除、数据源
#      14 源等）完整记录见下方 stage2_20260815_v1 头注存档，语义全部
#      沿用不变。
# ===== 以下为 stage2_20260815_v1 头注存档 =====
