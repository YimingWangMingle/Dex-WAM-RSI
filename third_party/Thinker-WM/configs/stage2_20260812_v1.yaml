model:
  wan:
    checkpoint_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B
    config_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B
    vae_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    precision: bfloat16
  vlm:
    checkpoint_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Qwen3-VL-2B-Instruct
    config_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Qwen3-VL-2B-Instruct
    precision: bfloat16
    frozen: true
  wm:
    video_encoder_layer_num: 8
    video_decoder_layer_num: 8
    action_encoder_layer_num: 8
    action_decoder_layer_num: 8
    und_layer_num: 4
    action_t_downsample: 1
    # 模态 dropout（评审 #4 决策 3/4）：video/action/prompt 三模态各自独立概率、
    # batch 级每 update step 重采（被 drop 模态不进网络、loss 置零；video 与
    # action 同 drop 时保底留一）；independent_modality_noise=true 使同批
    # video/action 独立采样 timestep/σ，训练模态缺失鲁棒性。
    modality_dropout_video: 0.1
    modality_dropout_action: 0.1
    modality_dropout_prompt: 0.1
    independent_modality_noise: true
    # D1（20260811 对齐 MotusBrain，per-modality timeshift video=6/action=1）：
    # flow_matching σ 调度的 video 侧 shift（训练 σ 采样与推理 video σ 网格
    # 共用；原 Wan2.2 TI2V 官方 5.0，本轮按论文取 6.0）；action 侧用下方
    # action_flow_shift（论文 action=1，更均匀）。改动必须训练/推理保持一致，
    # 勿两侧分别调。
    flow_shift: 6.0
    # action 独立 timeshift（独立 scheduler 采样 + 推理 action σ 网格；需
    # independent_modality_noise=true；null/缺省 = 跟随 flow_shift 旧行为）
    action_flow_shift: 1.0
    # B1/B2/B3（20260811 对齐 MotusBrain，详见 0807_v2 头注）：
    # B3：仅夹爪/灵巧手维归一化 [-1,1]，其余维保持物理量纲（"zscore" = 旧
    # 全维 per-robot z-score）。本轮新机器人未注册 ACTION_STATS → 恒等
    # （reader 侧 z-score 的源全程在 z 空间；egoverse raw 直通），见头注 4。
    action_norm_policy: gripper_hand_minmax
    # B1/B2：EEF 位姿维相对条件帧 state + 统一 6D 旋转训练目标
    # （"absolute_native" = 旧绝对坐标 + 原生旋转表示）；libero 经
    # eef_relative: false 跳过相对化（delta 命令本身已是相对量），见头注 1。
    action_target_repr: relative_eef_rot6
    # 【20260810 修复轮】action 侧训练改造（修复 #3a/#3c/#4，详见
    # stage2_20260807_v1.yaml 头注；与 σ shift 语义无关，自动兼容）：
    # σ 采样 cutoff（π0 式，去 σ=1.0 纯噪声端点；仅 action 侧）
    action_sigma_cutoff: 0.999
    # Min-SNR-γ 式 action loss 加权（v-prediction 变体 w=min(SNR,γ)/(1+SNR)，
    # batch 内归一到均值 1；"none" 关闭）
    action_loss_weighting: min_snr
    action_loss_snr_gamma: 5.0
    # 时序相关噪声（rolling/pyramid 式；训练加噪与推理初始噪声同模式，
    # "iid" 关闭）
    action_temporal_noise: pyramid
    action_temporal_noise_scales: [1, 4, 16]
  # 统一 VLM task prompt：train/sample/eval 用 t5 原始任务文本经
  # utils.vlm_utils.build_vlm_task_message 重建 vlm 消息（Scene/Task/Action/Outcome 四字段）。
  # prompt_mode: text_only 的源（openvid/egoverse）不套该模板，原始文本直通
  # VLM tokenizer+语言模型（见头注 2）。
  unified_vlm_task_prompt: true
  inference:
    num_inference_timesteps: 50    # 与 shift 调度配套（官方 50 步）
    guidance_scale: 5.0    # CFG 引导强度（评审 #6；Wan2.2 TI2V 官方 guide_scale=5.0），仅作用于 video 速度场，配合 condition_dropout_prob 训练出的无条件分支；1.0 = 关闭
    # 【20260810 修复轮】action 侧推理参数（修复 #1/#3b/#9c）：
    action_guidance_scale: 1.0    # 修复 #1：action 不做 CFG（π0/Diffusion Policy 惯例；!=1.0 仅为消融对照保留）
    action_num_inference_timesteps: 10    # 修复 #9c：action 独立去噪步数（UWM 式 per-modality σ 网格；D1 后该网格用 action_flow_shift=1.0）
    action_temporal_smooth_alpha: 0.5    # 修复 #3b：推理时序指数平滑强度（0 = 关闭；0.5 为首轮对照取值，可按 jitter 比调）
  timing_level: 2    # 模型内部耗时检查点级别: 1=分支级, 2=+逐block(每block两次CUDA同步; 5B模型每步约60次同步, 占比可忽略; 不需要时改回1)
  condition_dropout_prob: 0.1    # 文本条件 dropout（评审 #6）：10% 样本的 VLM 文本替换为空文本，训练无条件分支，使 CFG 可用；推理侧用 model.inference.guidance_scale>1 启用
  vlm_field_dropout_prob: 0.1    # VLM 四字段（Scene/Task/Action/Outcome）逐样本 dropout（计划 §2）：被 drop 字段从统一 prompt 格式指令整字段移除、保底留 1；随消息重建重采
  freeze_action_branch: false
  gradient_checkpointing: true
  checkpoint_video_branch: true
  checkpoint_uni_branch: true
  checkpoint_action_branch: true
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
training:
  batch_size: 16
  max_steps: 300000
  learning_rate: 1.25e-05
  weight_decay: 0.01
  scheduler_type: linear
  warmup_steps: 0
  cycle_length: 1000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5    # 须与 configs/zero1.json 的 gradient_clipping 一致（修复 #2：ZeRO-1 下实际裁剪在 engine 侧，本键用于日志记录与本地非 deepspeed 路径）
  use_amp: true
  find_unused_parameters: false
  num_workers: 0
  prefetch_factor: null
  persistent_workers: false
  pin_memory: false
  # 每个 batch VAE encode 一次后、按不同噪声独立参数更新的步数（默认 1=不复用）。
  # 取数/VAE encode 摊薄到 N 个 optimizer step；global_step/LR 调度仍按 step 计，
  # 数据消耗相应慢 N 倍（同一 batch 被连续更新 N 次，噪声/timestep 每步重采样）。
  train_steps_per_vae_encode: 10
system:
  checkpoint_dir: ./checkpoints
  log_level: INFO
  log_interval: 10
  save_interval: 1000000000
  val_interval: 204800000000
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
  ready_batch_queue_enabled: true
  ready_batch_queue_size: 6
  ready_batch_queue_timeout_seconds: 600
  ready_batch_queue_low_watermark: 0
  ready_batch_queue_clone_tensors: true
  train_loop_gc_interval: 100
diagnostics:
  action_diagnostics_enabled: true
  action_diagnostics_interval: 50
  action_loss_anomaly_threshold: 10.0
  action_tensor_abs_anomaly_threshold: 50.0
  grad_norm_anomaly_threshold: 1000.0
  heartbeat_enabled: false
  heartbeat_memory_interval: 10
  # 非有限全量扫描（参数/梯度逐 tensor isfinite + 跨 rank allreduce）降频到
  # 每 50 步（评审 #12）：1=每步（旧行为，5B 模型每步上千次 CUDA 同步）；
  # 间隔步不拦截非有限梯度（loss 标量检查仍每步执行）；MOTUS_NONFINITE_FAIL_FAST=0
  # 时扫描整体关闭。
  nonfinite_scan_interval: 50
logging:
  report_to: tensorboard
  wandb_project: motus
  tensorboard_log_dir: tensorboard_logs_new
  run_name: stage2_20260812_v1_five_family_mix_bs16_300k
resume:
  # finetune 热启动（仅加载权重），不做完整续训
  checkpoint_path: null
  auto_resume_latest: false
  # 弹性续训不重置 scheduler（评审 #13）：auto-resume 接着原 LR 计划走、不重新
  # warmup；首次 finetune 热启动走下方 finetune.checkpoint_path 仅权重路径，本键不生效。
  reset_scheduler: false
finetune:
  # 链式全量热启动（用户决策：不丢弃/不重置任何权重，含 action 分支与 uni
  # 共享中间块；U=80 不变，无需 reshape）。
  # 【启动前必填】0807_v2 最新 ckpt 路径（或经 FINETUNE_CHECKPOINT 环境变量
  # 覆盖；k8s 启动脚本 k8s_job_script/stage2_20260812_v1.sh 同位占位）。
  checkpoint_path: null
monitor:
  # 训练监控（monitor/ 库）：写 append-only 分块 JSONL 到
  # <仓库上级目录>/motus_monitor_data/，本机 web 服务经 SSH 增量同步。
  # 关闭：enabled: false 或环境变量 MOTUS_MONITOR_ENABLED=0。
  enabled: true
  metrics_interval: 1  # monitor 指标记录间隔（步）：1=每步都记；与 console/TB 的 log_interval 无关
  data_dir: null          # null = 默认目录（可用 $MOTUS_MONITOR_DIR 覆盖）
  system_interval: 2.0    # 每节点系统采样间隔（秒，local_rank0 采样）
  status_interval: 2.0    # status.json 最小重写间隔（秒）
  collect_system: true
periodic_eval:
  # 周期性定集评测（periodic_eval/ 包）：每 interval_steps 步、每个 rank 各评
  # 一个固定 batch（batch size = training.batch_size），每轮内容/数据集配比
  # 固定。素材在训练启动时由 CPU-only 后台子进程预解码到 cache_dir
  # （manifest + sha256，跨训练任务复用），训练前台零解码。产物写 monitor
  # run_dir 的 eval/（索引流 + compare.mp4/actions.png/meta.json），
  # Web UI「eval 评估」tab 展示。全流程失败自吞，不影响训练。
  enabled: true
  interval_steps: 1000
  num_inference_steps: null     # null = model.inference.num_inference_timesteps（50）
  seed: 20260805                # 评测窗口/生成噪声种子（固定 → 每轮内容一致）
  vlm_generate: true            # 旁路 greedy 生成 VLM 文本（Scene/Task/Action/Outcome）
  vlm_max_new_tokens: 128
  fps: 6
  keep_rounds: 20               # 集群侧只保留最近 20 轮媒体（本机已同步副本不受影响）
  save_separate_videos: false   # 默认只存 compare 三联屏；true 另存 gt/pred.mp4
  cache_dir: /data/chen.liao/thinkerwm-pretrain/periodic_eval_cache
  # 各评测源权重（决定各 rank batch 来源配比，largest-remainder 确定性分配）：
  # 缺省 = 训练权重（17 源，见 dataset.sources）+ ewmbenchmark 0.25；
  # 在此显式列出可覆盖，权重 <= 0 排除该源。
  source_weights:
    ewmbenchmark: 0.25
  ewmbenchmark:
    enabled: true
    root: /data/chen.liao/EWMBenchmark
    robot_name: agibot-a2-d     # EWM 无 action/state 语义，借用已注册机器人名
