# 加入video-action-task进行全量训练
# 数据集包括TODO
common:
  action_dim: 26
  state_dim: 26
  num_video_frames: 48
  video_height: 480
  video_width: 640
  global_downsample_rate: 1
  video_action_freq_ratio: 1
dataset:
  type: indexed_mix
  batches_per_epoch: null
  robot_names:
    aloha-agilex:
      action_dim: 14
      aliases:
      - aloha-agilex
      - aloha
      - agilex
    franka-panda:
      action_dim: 7
      aliases:
      - franka-panda
      - franka
      - panda
    ARX-X5:
      action_dim: 14
      aliases:
      - arx-x5
      - arx
      - x5
    piper:
      action_dim: 14
      aliases:
      - piper
    ur5-wsg:
      action_dim: 14
      aliases:
      - ur5-wsg
      - ur5
      - wsg
    agibot-a2-d:
      action_dim: 26
      aliases:
      - agibot-a2-d
      - agibot
      - agibot_beta
    ego4d-null:
      action_dim: 26
      aliases:
      - ego4d-null
      - ego4d
    robotmind-tianyi:
      action_dim: 16
      aliases:
      - robotmind-tianyi
      - tianyi
      - robotmind
    robotmind-arkmobile:
      action_dim: 20
      aliases:
      - robotmind-arkmobile
      - arkmobile
      - ark-mobile
    robotmind-ark:
      action_dim: 14
      aliases:
      - robotmind-ark
      - ark
    robotmind-tienkung:
      action_dim: 16
      aliases:
      - robotmind-tienkung
      - tienkung
  # indexed（Catalog/SamplePool）数据源。catalog 由 motus_data releases.yaml 默认解析
  # （/data/jiyuan.wang/EpisodeCatalogs 下已冻结的 20260723/20260727 release）。
  # 每源 pool spec 为 sampling_ranges：运行时内存动态生成随机窗口（不落盘 pool 文件）。
  # TODO(生产 ranges)：下列 ranges 路径为生产占位，正式训练前必须先用
  # data_prepare/build_sampling_ranges.py 按冻结 catalog 构建（agibot 注意 ratio=6，
  # 其动作索引按 6:1 步长生成 288 个/窗口，与 adapter 侧配置一致）；
  # train/holdout 由 split ranges 表达（--split train/holdout --holdout-fraction 0.01
  # 分别建库，配置 eval_pool 指向 holdout ranges）。
  sources:
  - name: robotwin_aloha
    dataset: robotwin_aloha
    weight: 0.025
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotwin_aloha.train.ranges.sqlite
  - name: robotwin_ur5
    dataset: robotwin_ur5
    weight: 0.025
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotwin_ur5.train.ranges.sqlite
  - name: robotwin_arx
    dataset: robotwin_arx
    weight: 0.025
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotwin_arx.train.ranges.sqlite
  - name: robotwin_piper
    dataset: robotwin_piper
    weight: 0.025
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotwin_piper.train.ranges.sqlite
  - name: agibot
    dataset: agibot
    weight: 1.0
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/agibot.train.ranges.sqlite
  - name: agibot_beta
    dataset: agibot_beta
    weight: 1.0
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/agibot_beta.train.ranges.sqlite
  - name: robotmind_tianyi
    dataset: robotmind_tianyi
    weight: 0.05
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotmind_tianyi.train.ranges.sqlite
  - name: robotmind_arkmobile
    dataset: robotmind_arkmobile
    weight: 0.025
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotmind_arkmobile.train.ranges.sqlite
  - name: robotmind_ark
    dataset: robotmind_ark
    weight: 0.05
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotmind_ark.train.ranges.sqlite
  - name: robotmind_tienkung
    dataset: robotmind_tienkung
    weight: 0.05
    pool:
      type: sampling_ranges
      path: /data/jiyuan.wang/SamplingRanges/_PROD_TODO/ten_source_prod_v1/robotmind_tienkung.train.ranges.sqlite
model:
  wan:
    checkpoint_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B
    config_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B
    vae_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    precision: bfloat16
  vlm:
    checkpoint_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Qwen3-VL-2B-Instruct
    config_path: /code1/llm_team/chen.liao/Motus/pretrained_models/Qwen3-VL-2B-Instruct
    precision: bfloat16
    frozen: true
  wm:
    video_encoder_layer_num: 8
    video_decoder_layer_num: 8
    action_encoder_layer_num: 8
    action_decoder_layer_num: 8
    und_layer_num: 4
    action_t_downsample: 1
  time_distribution:
    timestep_sample_method: logit_normal
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 20
  timing_level: 2    # 模型内部耗时检查点级别: 1=分支级, 2=+逐block(每block两次CUDA同步; 5B模型每步约60次同步, 占比可忽略; 不需要时改回1)
  freeze_action_branch: false
  gradient_checkpointing: true
  checkpoint_video_branch: true
  checkpoint_uni_branch: true
  checkpoint_action_branch: true
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
training:
  batch_size: 12
  max_steps: 300000
  learning_rate: 1.0e-05
  weight_decay: 0.01
  scheduler_type: linear
  warmup_steps: 1000
  cycle_length: 1000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  num_workers: 0
  prefetch_factor: null
  persistent_workers: false
  pin_memory: false
system:
  checkpoint_dir: ./checkpoints
  log_level: INFO
  log_interval: 10
  save_interval: 1000000000
  val_interval: 204800000000
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
  ready_batch_queue_enabled: true
  ready_batch_queue_size: 6
  ready_batch_queue_timeout_seconds: 600
  ready_batch_queue_low_watermark: 0
  ready_batch_queue_clone_tensors: true
  train_loop_gc_interval: 100
diagnostics:
  action_diagnostics_enabled: true
  action_diagnostics_interval: 50
  action_loss_anomaly_threshold: 10.0
  action_tensor_abs_anomaly_threshold: 50.0
  grad_norm_anomaly_threshold: 1000.0
  heartbeat_enabled: false
  heartbeat_memory_interval: 10
logging:
  report_to: tensorboard
  wandb_project: motus
  tensorboard_log_dir: tensorboard_logs_new
  run_name: stage2_video_action_prompt_holdout1pct_0713_10src_bs12_q6_1node8_300k_20260721
resume:
  checkpoint_path: null
  auto_resume_latest: false
  reset_scheduler: true
finetune:
  checkpoint_path: null
monitor:
  # 训练监控（monitor/ 库）：写 append-only 分块 JSONL 到
  # <仓库上级目录>/motus_monitor_data/，本机 web 服务经 SSH 增量同步。
  # 关闭：enabled: false 或环境变量 MOTUS_MONITOR_ENABLED=0。
  enabled: true
  metrics_interval: 1  # monitor 指标记录间隔（步）：1=每步都记；与 console/TB 的 log_interval 无关
  data_dir: null          # null = 默认目录（可用 $MOTUS_MONITOR_DIR 覆盖）
  system_interval: 2.0    # 每节点系统采样间隔（秒，local_rank0 采样）
  status_interval: 2.0    # status.json 最小重写间隔（秒）
  collect_system: true
